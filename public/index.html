<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Gestió Musical RA6</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="card">
      <h1>Gestió d'Artistes i Àlbums</h1>
      <h2>1) Afegir artista</h2>
      <form id="artist-form">
        <input id="artist-name" placeholder="Nom de l'artista" required />
        <button type="submit">Desar Artista</button>
      </form>
    </section>

    <section class="card">
      <h2>2) Afegir Àlbum </h2>
      <form id="album-form">
        <label>Artista existent:</label>
        <select id="artist-select" required>
            <option value="">Prem "Carregar" per veure la llista</option>
        </select>
        <br><br>
        <input id="album-title" placeholder="Títol de l'àlbum" required />
        <button type="submit">Desar Àlbum</button>
      </form>
    </section>

    <section class="card">
      <h2>3) Consultar i actualitzar llistes</h2>
      <button id="load-btn">Carregar / Actualitzar dades</button>
      <p id="artist-output" style="background: #f4f4f4; padding: 10px; border-radius: 5px;">Prem el botó per carregar.</p>
    </section>
<section class="card" style="border: 1px solid #ff4d4d; padding: 15px; margin-top: 20px;">
  <h2>4) Eliminar Artista (Secció Independent)</h2>
  <p>1. Prem "Actualitzar llista" per carregar els artistes al desplegable.</p>
  
  <button type="button" id="btn-refresh-delete">Actualitzar llista per eliminar</button>
  
  <div style="margin-top: 15px;">
    <label>Selecciona l'artista a esborrar:</label>
    <select id="artist-delete-select">
      <option value="">Esperant actualització</option>
    </select>
    
    <button type="button" id="btn-confirm-delete" style="background-color: #ff4d4d; color: white; border: none; padding: 8px 15px; cursor: pointer;">
      Eliminar definitivament
    </button>
  </div>
</section>
  </main>
  <script src="app.js"></script>
</body>
</html>
