<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>El meu Projecte RA6</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="card">
      <h2>Afegir Artista</h2>
      <form id="artist-form">
        <input id="artist-name" placeholder="Nom..." required />
        <button type="submit">Guardar</button>
      </form>
    </section>

    <section class="card">
      <h2>Nou Àlbum</h2>
      <form id="album-form">
        <select id="artist-select" required>
          <option value="">(Carrega la llista)</option>
        </select>
        <input id="album-title" placeholder="Títol àlbum" required />
        <button type="submit">Crear àlbum</button>
      </form>
    </section>

    <section class="card">
      <h2>Llistat</h2>
      <button id="load-btn">Actualitzar dades</button>
      <p id="artist-output">Encara no hi ha res.</p>
    </section>

    <section class="card">
      <h2>Borrar Àlbums</h2>
      <button type="button" id="refrescador">Veure àlbums</button>
      <select id="album-delete-select">
        <option value="">--</option>
      </select>
      <button type="button" id="btn-delete-album">Borrar</button>
    </section>

    <section class="card">
      <h2>Borrar Artista</h2>
      <button type="button" id="btn-refresh-delete">Veure artistes</button>
      <select id="artist-delete-select">
        <option value="">--</option>
      </select>
      <button type="button" id="btn-confirm-delete">Eliminar</button>
    </section>

    <section class="card">
      <h2>Modificar Artista</h2>
      <button type="button" id="btn-refresh-edit">Carregar Artistes</button>
      <select id="artist-edit-select">
        <option value="">--</option>
      </select>
      <input id="artist-edit-name" placeholder="Nou nom..." />
      <button type="button" id="btn-confirm-edit">Desar canvis</button>
    </section>

    <section class="card">
      <h2>Nova Cançó</h2>
      <button type="button" id="btn-refresh-song-forms">Carregar desplegables</button>
      <form id="song-form">
        <select id="song-artist-select" required>
          <option value="">Selecciona Artista</option>
        </select>
        <select id="song-album-select" required>
          <option value="">Selecciona Àlbum</option>
        </select>
        <input id="song-title" placeholder="Nom de la cançó" required />
        <button type="submit">Guardar Cançó</button>
      </form>
    </section>

    <section class="card">
      <h2>Borrar Cançons</h2>
      <button type="button" id="btn-refresh-songs">Veure cançons</button>
      <select id="song-delete-select">
        <option value="">--</option>
      </select>
      <button type="button" id="btn-delete-song">Borrar</button>
    </section>
  </main>
  
  <script src="app.js"></script>
</body>
</html>
